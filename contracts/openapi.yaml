openapi: 3.1.0
info:
  title: Delivery Platform API
  version: 1.0.0
  description: Contrato compartido por las aplicaciones React Native y Flutter.
servers:
  - url: http://localhost:8000/api/v1
    description: Desarrollo local
paths:
  /health:
    get:
      operationId: getHealth
      summary: Comprueba la disponibilidad de la API
      tags: [System]
      responses:
        '200':
          description: API disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [service, status, version, timestamp]
          properties:
            service: { type: string, example: delivery-api }
            status: { type: string, const: ok }
            version: { type: string, example: v1 }
            timestamp: { type: string, format: date-time }
